name: Run VIP-cli tests

on: pull_request

env:
  NODE_OPTIONS: --unhandled-rejections=warn
  DO_NOT_TRACK: '1'

permissions:
  contents: read

jobs:
  Run_windows_tests:
    name: Run Windows Tests
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      # To prevent issues with fixtures on Windows tests
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit Tests
        run: npm run jest

      # Work around intermittent hosted-runner Docker startup failures:
      # https://github.com/actions/runner-images/issues/13729
      - name: Ensure Docker is running
        shell: powershell
        run: |
          $dockerService = Get-Service -Name "docker"
          if ($dockerService.Status -ne "Running") {
            Start-Service -Name "docker"
          }

      - name: Test Command line
        run: ./__tests__/e2e_test.bat
