---
name: Prepare a new npm release

on:
  workflow_dispatch:
    inputs:
      npm-version-type:
        description: 'The npm version type we are publishing.'
        required: true
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare a new npm release
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source code
        uses: actions/checkout@v7

      - name: Run npm-prepare-release
        uses: Automattic/vip-actions/npm-prepare-release@6bf9fde7ac8acce516488384357e3e6fb28669cf # v0.7.6
        env:
          # The action captures `npm version` stdout to build the release branch name.
          # Keep lifecycle script banners from polluting that value while still allowing
          # the `version` script to sync npm-shrinkwrap.json.
          NPM_CONFIG_LOGLEVEL: silent
        with:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm-version-type: ${{ inputs.npm-version-type }}
          conventional-commits: 'true'
