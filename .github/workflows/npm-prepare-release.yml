---
name: Prepare a new npm release

on:
  workflow_dispatch:
    inputs:
      npm-version-type:
        description: 'The npm version type we are publishing.'
        required: true
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare a new npm release
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source code
        uses: actions/checkout@v7

      - name: Run npm-prepare-release
        uses: Automattic/vip-actions/npm-prepare-release@438cd00aac2463a2dbfb4a747ad7b1ac67a2575a # v0.7.5
        with:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm-version-type: ${{ inputs.npm-version-type }}
          conventional-commits: 'true'
