---
name: Publish to npm (if applicable)
on:
  pull_request:
    types: [closed]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    if: contains( github.event.pull_request.labels.*.name, '[ Type ] NPM version update' ) && startsWith( github.head_ref, 'release/') && github.event.pull_request.merged == true
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: Automattic/vip-actions/npm-publish@v0.7.3
        with:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_TRUSTED_PUBLISHING: 'true'
          PROVENANCE: 'true'
          CONVENTIONAL_COMMITS: 'true'

  changelog:
    name: Publish docs changelog
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changelog.yml
    needs: publish
    secrets:
      CHANGELOG_DOCS_POST_TOKEN: ${{ secrets.CHANGELOG_DOCS_POST_TOKEN }}

  publish-docs:
    name: Publish cli command reference docs
    permissions:
      contents: read
    uses: ./.github/workflows/publish-docs.yml
    needs: publish
    secrets:
      DOCS_SECRET_TOKEN: ${{ secrets.DOCS_SECRET_TOKEN }}
