name: Publish changelog
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CHANGELOG_DOCS_POST_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish-changelog:
    name: Publish changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: Automattic/vip-actions/changelog@6bf9fde7ac8acce516488384357e3e6fb28669cf # trunk
        with:
          endpoint: 'https://docs.wpvip.com/wp-json/wp/v2/changelogs'
          endpoint-token: ${{ secrets.CHANGELOG_DOCS_POST_TOKEN }}
          endpoint-auth-type: 'basic'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          status: 'publish'
          terms: changelog_category:110
          tag-id: '115'
          link-to-pr: false
          source: 'last-release'
          changelog-title: 'VIP-CLI v{version}'
