name: Generate Changelog and Validate Docs for PR

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read

jobs:
  changelog:
    name: Generate Changelog for PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: >
      github.event.issue.pull_request &&
      github.event.comment.body == '/changelog'
    steps:
      - name: Generate changelog for PR
        uses: Automattic/vip-actions/ai-changelog-generator@ab67a34cd817b925d1cb7380ec2490e580b0bccd # trunk
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
  docs-doctor:
    name: Analyze docs.wpvip.com for inconsistencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: >
      github.event.issue.pull_request &&
      github.event.comment.body == '/docs-doctor'
    steps:
      - name: Generate Report
        uses: Automattic/vip-actions/docs-doctor@eeb5b001885157fbbe6d06a89214b97fd5b03539 # trunk
        with:
          url: https://docs.wpvip.com
          sitemap_url: https://docs.wpvip.com/page-sitemap.xml
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          pr_number: ${{ github.event.issue.number }}
