# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---
# Shared vars (CI_TOOLKIT_PLUGIN, BIN_BASE) come from
# .buildkite/shared-pipeline-vars, which our setup source's before
# `buildkite-agent pipeline upload` interpolates this file.
#
# Every commit builds + smoke-tests all three platforms. macOS signs and
# notarizes, and Windows Authenticode-signs, on every build so those paths
# are not tag-only.

env:
  DO_NOT_TRACK: '1'

steps:
  - label: ':macos: Build & sign (macOS)'
    key: binaries-macos
    command: .buildkite/build-macos.sh
    plugins:
      - $CI_TOOLKIT_PLUGIN
    agents:
      queue: mac
    env:
      IMAGE_ID: $IMAGE_ID
    notify:
      - github_commit_status:
          context: 'Build & sign (macOS)'
    artifact_paths:
      - 'dist/vip-next-darwin-*.tar.gz*'

  - label: ':windows: Build & sign (Windows)'
    key: binaries-windows
    command: powershell -NoProfile -ExecutionPolicy Bypass -File .buildkite/build-windows.ps1
    plugins:
      - $CI_TOOLKIT_PLUGIN
    agents:
      queue: windows
    notify:
      - github_commit_status:
          context: 'Build & sign (Windows)'
    artifact_paths:
      - 'dist/vip-next-windows-amd64.tar.gz*'

  - label: ':linux: Build (Linux)'
    command: .buildkite/build-linux.sh
    agents:
      queue: default
    notify:
      - github_commit_status:
          context: 'Build (Linux)'
    artifact_paths:
      - 'dist/vip-next-linux-*.tar.gz*'

  # Installer failures remain visible but cannot fail the binary release build.
  # Scripts explicitly upload only fully signed and verified installer pairs.
  - label: ':macos: Package & sign installer (macOS)'
    key: installer-macos
    depends_on: binaries-macos
    soft_fail: true
    command: bash .buildkite/build-macos-installer.sh
    plugins:
      - $CI_TOOLKIT_PLUGIN
    agents:
      queue: mac
    env:
      IMAGE_ID: $IMAGE_ID
    notify:
      - github_commit_status:
          context: 'Package & sign installer (macOS)'

  - label: ':windows: Package & sign installer (Windows)'
    key: installer-windows
    depends_on: binaries-windows
    soft_fail: true
    command: powershell -NoProfile -ExecutionPolicy Bypass -File .buildkite/build-windows-installer.ps1
    plugins:
      - $CI_TOOLKIT_PLUGIN
    agents:
      queue: windows
    notify:
      - github_commit_status:
          context: 'Package & sign installer (Windows)'
