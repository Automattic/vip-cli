name: phpmyadmin-print
description: |
  `vip @parityapp.develop db phpmyadmin --print`. The recorded status is
  already "running", so Node's maybeEnablePhpMyAdmin short-circuits
  (src/commands/phpmyadmin.ts:213-222): status → generate, with NO enable
  mutation. vip-next keeps stdout URL-only for scripting; Node's progress
  tracker writes its warning and frames to stdout before `console.log( url )`.
argv: ["@parityapp.develop", "db", "phpmyadmin", "--print"]
env:
  DO_NOT_TRACK: "1"
  NODE_ENV: test
recording: phpmyadmin-print
expect:
  exit_code: 0
expected_drift:
  signature: "d0eec49aee54cb06a0b1759bf3e8308dabeeac97f4bca7978ff9d91cec94481b"
  reason: >-
    parity register 1.26 (KEEP): vip-next keeps --print stdout URL-only and
    sends human progress to stderr; Node interleaves progress and the URL on
    stdout.
normalize:
  stdout: []
