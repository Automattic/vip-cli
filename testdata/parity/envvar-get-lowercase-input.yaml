name: envvar-get-lowercase-input
description: |
  `vip @parityapp.develop config envvar get foo` (lowercase). Verifies
  Node-parity uppercasing: the argument is trimmed and uppercased before
  lookup, so the lowercase form resolves to FOO and prints its value.
argv: ["@parityapp.develop", "config", "envvar", "get", "foo"]
env:
  DO_NOT_TRACK: "1"
  NODE_ENV: test
recording: envvar-get-lowercase-input
expect:
  exit_code: 0
normalize:
  stdout: []
