name: wp-websocket-shell
description: |
  A no-argument WebSocket wp command opens a shell without triggering WP-CLI.
  Invalid input, a GraphQL error, two completed socket commands, and a delayed
  nonzero socket exit each return to the prompt. Exit closes the shell.
argv: ["@parityapp.develop", "wp"]
env:
  DO_NOT_TRACK: "1"
  NODE_ENV: test
  NO_COLOR: "1"
recording: wp-websocket-shell
expect:
  exit_code: 0
