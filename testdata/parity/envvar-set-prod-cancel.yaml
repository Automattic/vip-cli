name: envvar-set-prod-cancel
description: |
  Production env, no --skip-confirmation, non-interactive context →
  prod-gate Confirm returns ErrNonInteractive → handler prints
  "Command cancelled" → exit 0. The add.json fixture is INTENTIONALLY
  omitted so the test fails loudly if the mutation is fired anyway.
argv:
  - "@parityapp.production"
  - "config"
  - "envvar"
  - "set"
  - "MY_VAR"
  - "--from-file=../../testdata/parity/recordings/envvar-set-prod-cancel/value.txt"
env:
  DO_NOT_TRACK: "1"
  NODE_ENV: test
  VIP_NON_INTERACTIVE: "1"
recording: envvar-set-prod-cancel
expect:
  exit_code: 0
expected_drift:
  signature: "1e44b3a584444dd18ab5e960f5df46a757ee337a0ac16526383a2a075b26381b"
  reason: >-
    parity register 1.24 (KEEP): in a non-TTY vip-next explicitly reports that
    it cannot prompt and cancels without mutating; Node emits enquirer's raw
    ANSI prompt before its unresolved prompt exits without mutating.
normalize:
  # Node renders this prompt through enquirer, which writes it to stdout with
  # colour and cursor control. Those sequences differ between macOS and a
  # headless Linux runner, so without stripping them the drift signature below
  # is platform-specific and can only ever match on one of the two.
  #
  # enquirer also picks its pointer glyph by platform: U+203A on macOS,
  # U+2023 on Linux. That is the difference that actually broke this scenario
  # in CI; the ANSI rule above alone was not enough.
  #
  # The prompt's text survives, so the divergence this scenario exists to
  # record - Node prompting where vip-next refuses to - is still compared.
  stdout:
    - '\x1b\[[0-9;?]*[a-zA-Z] -> '
    - '[\x{2023}\x{203A}] -> <POINTER>'
  stderr: []
