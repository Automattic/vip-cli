name: cache-purge-url-single
description: |
  `vip @parityapp.develop cache purge-url <URL>` with a single positional
  URL. The mutation returns the URL as-is (server canonicalization may
  differ in production); stdout has `- Purged URL: <URL>`.
argv:
  - "@parityapp.develop"
  - "cache"
  - "purge-url"
  - "https://example-app.go-vip.co/sample-page/"
env:
  DO_NOT_TRACK: "1"
  NODE_ENV: test
recording: cache-purge-url-single
expect:
  exit_code: 0
normalize:
  stdout: []
