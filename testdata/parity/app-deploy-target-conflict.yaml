name: app-deploy-target-conflict
description: |
  `--to` combined with `--app`/`--env` is rejected before any file,
  token, or API check. Exit 1.
argv: ["app", "deploy", "../../testdata/parity/recordings/app-deploy-validate/clean.tar.gz", "--to=parityapp.production", "--app=parityapp", "--env=develop"]
env:
  DO_NOT_TRACK: "1"
  NODE_ENV: test
  NO_COLOR: "1"
  WPVIP_DEPLOY_TOKEN: "deploy-tok"
expect:
  exit_code: 1
expected_drift:
  signature: "e8de81d4b21b06ebcb410798a1c9e60cba4955db4b189c3445f006d767cd7945"
  reason: >-
    parity register 1.10 (KEEP): vip-next emits a clean one-line error on
    stderr; Node adds a second space after Error and a runtime Debug line on
    stdout.
normalize:
  stdout:
    - '(?m)^Debug:.*$ -> Debug: <RUNTIME>'
